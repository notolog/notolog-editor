# Notolog Editor
# An open-source Markdown editor built with Python.
#
# Repository: https://github.com/notolog/notolog-editor
# License: MIT License
#
# This workflow installs Python dependencies, runs tests, and performs linting across multiple Python versions.
# For more information, see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies (General)
      run: |
        python -m pip install --upgrade pip
        # Dev tools
        pip install flake8 mccabe pycodestyle pyflakes
        # Build tools
        pip install poetry-core build

    - name: Build the package
      run: python -m build

    - name: Verify wheel startup document
      run: python -c "from pathlib import Path; import zipfile; wheel = next(Path('dist').glob('*.whl')); archive = zipfile.ZipFile(wheel); assert archive.read('README.md') == Path('README.md').read_bytes()"

    - name: Install the package
      if: matrix.os != 'windows-latest'
      run: |
        pip install dist/*.whl
      shell: bash

    - name: Install the package (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        Get-ChildItem dist\*.whl | ForEach-Object { pip install $_.FullName }
      shell: powershell

    - name: Install test dependencies
      run: |
        pip install coverage pytest pytest-asyncio pytest-cov pytest-mock

    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        # fixes: libEGL.so.1: cannot open shared object file: No such file or directory
        sudo apt-get install -y libegl1-mesa-dev
      shell: bash

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --per-file-ignores="__init__.py:F401" --statistics

    - name: Print working directory
      run: pwd || echo %CD%

    - name: List directory contents (Cross-platform)
      run: |
        Get-ChildItem -Force | Format-Table
      shell: pwsh

    - name: List directory contents (Python)
      run: |
        python -c "import os; print('\n'.join(os.listdir('.')))"

    - name: Test with pytest and coverage report (Codecov job)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      run: |
        # Skip UI tests on Ubuntu (headless environment limitations)
        pytest tests/ --ignore=tests/ui_tests/ --cov=notolog --cov-report=term --cov-report=xml

    - name: Test with pytest and coverage report (Ubuntu)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version != '3.12'
      run: |
        # Skip UI tests on Ubuntu (headless environment limitations)
        pytest tests/ --ignore=tests/ui_tests/ --cov=notolog --cov-report=term

    - name: Test with pytest and coverage report (Windows/macOS)
      if: matrix.os != 'ubuntu-latest'
      run: |
        pytest tests/ --cov=notolog --cov-report=term

    - name: Upload coverage report
      if: ${{ !cancelled() && matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest' && hashFiles('coverage.xml') != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-python-3.12
        path: coverage.xml
        if-no-files-found: error

    - name: Upload coverage to Codecov
      if: >-
        matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest' &&
        (github.repository == 'notolog/notolog-editor' || vars.CODECOV_ENABLED == 'true')
      uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
      with:
        files: ./coverage.xml
        disable_search: true
        fail_ci_if_error: true
        use_oidc: true
